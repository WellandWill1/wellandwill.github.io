<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Network Library</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-color: #1f2833;
            --accent-gold: #ffc93c;
            --accent-orange: #ff9a3c;
            --text-light: #ffffff;
            --text-dim: #c5c6c7;
        }
        html, body { height: 100%; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-dim); font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        
        .arcade-layout { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* 📂 SIDEBAR MIGRATION PANELS */
        .game-sidebar { width: 260px; background-color: #06070a; border-right: 2px solid var(--accent-gold); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; transition: transform 0.3s ease; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255, 201, 60, 0.15); text-align: center; }
        .sidebar-header h1 { margin: 0; font-size: 1.3rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 2px; }
        .search-box { padding: 12px 15px; background: #12161a; border: none; border-bottom: 1px solid rgba(255,201,60,0.1); color: #fff; font-size: 0.9rem; outline: none; }
        .game-menu-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px 0; margin: 0; }
        .game-item-btn { width: 100%; padding: 14px 20px; background: transparent; border: none; color: var(--text-dim); text-align: left; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; border-left: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .game-item-btn:hover { background: rgba(255, 201, 60, 0.05); color: var(--accent-gold); }
        .game-item-btn.active { background: rgba(255, 201, 60, 0.12); color: var(--text-light); border-left-color: var(--accent-gold); }
        
        /* 🕹️ FULLSCREEN LAYER CANVAS FRAME AREA */
        .stage-area { flex: 1; background: #000; position: relative; height: 100%; }
        .sandbox-frame { width: 100%; height: 100%; border: none; display: block; background: #000; }
        
        /* 🤫 SYSTEM STEALTH LABELS */
        .stealth-overlay-tag { position: absolute; bottom: 15px; right: 25px; z-index: 999; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; color: rgba(255,255,255,0.3); pointer-events: none; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.05); }
        
        .sidebar-hidden .game-sidebar { transform: translateX(-260px); width: 0; overflow: hidden; border: none; }
    </style>
</head>
<body>

    <div class="arcade-layout" id="main-layout-container">
        <!-- Sidebar Navigation -->
        <div class="game-sidebar">
            <div class="sidebar-header">
                <h1>Arcade Engine</h1>
            </div>
            <input type="text" id="search-bar" class="search-box" placeholder="Filter games list..." oninput="filterCatalog()">
            <div class="game-menu-list" id="catalog-container">
                <!-- Links inject here -->
            </div>
        </div>
        
        <!-- Live Game Container Frame -->
        <div class="stage-area">
            <iframe id="arcade-frame" class="sandbox-frame" src="about:blank" allow="autoplay; gamepad; fullscreen; keyboard"></iframe>
            <div class="stealth-overlay-tag">Press [Q] to Panic Hide // Press [H] to hide sidebar menu</div>
        </div>
    </div>

    <script>
        // 🚀 WIRED DIRECTLY TO YOUR SECURE INTERNAL REPOSITORY PAGES
        const gameLibrary = [
            { name: "Retro Bowl", url: "/retro" },
            { name: "Slope 3D", url: "/slope" },
            { name: "Drive Mad", url: "/drive" }
        ];

        function loadLibraryUI() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";
            gameLibrary.forEach((game, index) => {
                let btn = document.createElement('button');
                btn.className = "game-item-btn";
                btn.innerHTML = `<span>🎮</span> <span>${game.name}</span>`;
                btn.onclick = () => injectGameSandbox(index, btn);
                container.appendChild(btn);
            });
            if (gameLibrary.length > 0) {
                injectGameSandbox(0, container.firstChild);
            }
        }

        function injectGameSandbox(idx, element) {
            document.querySelectorAll('.game-item-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            
            const targetUrl = gameLibrary[idx].url;
            const iframe = document.getElementById('arcade-frame');
            iframe.src = targetUrl;
        }

        function filterCatalog() {
            let filter = document.getElementById('search-bar').value.toUpperCase();
            let buttons = document.getElementsByClassName('game-item-btn');
            for (let i = 0; i < buttons.length; i++) {
                let txtValue = buttons[i].textContent || buttons[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    buttons[i].style.display = "";
                } else {
                    buttons[i].style.display = "none";
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === "q" || e.key === "Q") {
                document.getElementById('arcade-frame').src = "about:blank";
                window.location.href = "https://google.com";
            }
            if (e.key === "h" || e.key === "H") {
                document.getElementById('main-layout-container').classList.toggle('sidebar-hidden');
            }
        });

        window.addEventListener('DOMContentLoaded', loadLibraryUI);
    </script>
</body>
</html>
