<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Core Engine - 3</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #0b0c10; overflow: hidden; font-family: sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffc93c; font-weight: bold; font-size: 1.5rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="loading">INITIALIZING PROTOCOL...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <!-- Official OpenSource JS Engine Compilation Built Locally -->
    <script src="https://amazonaws.com" async onload="document.getElementById('loading').style.display='none';"></script>
</body>
</html>
