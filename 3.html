<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade - 3</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #40a0ff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; background: #40a0ff; }
        .controls-overlay { position: absolute; top: 15px; left: 15px; background: rgba(31, 40, 51, 0.9); border: 2px solid #ffc93c; padding: 15px; border-radius: 6px; color: #fff; font-size: 0.85rem; pointer-events: none; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }
        .slot { width: 40px; height: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid transparent; color: #fff; font-size: 0.8rem; }
        .slot.active { border-color: #ffc93c; background: rgba(255,255,255,0.1); }
        .slot-1 { background-color: #557a2b; } /* Grass */
        .slot-2 { background-color: #866043; } /* Dirt */
        .slot-3 { background-color: #7a7a7a; } /* Stone */
        .slot-4 { background-color: #b0722a; } /* Wood */
    </style>
</head>
<body>

    <div class="controls-overlay">
        <strong style="color: #ffc93c; text-transform: uppercase;">Unblocked Craft 2D</strong><br>
        • Move Camera: <span style="color: #ff9a3c;">A, D / Arrow Keys</span><br>
        • Break Block: <span style="color: #ff9a3c;">Left Click</span><br>
        • Place Block: <span style="color: #ff9a3c;">Shift + Left Click</span><br>
        • Select Block: <span style="color: #ff9a3c;">Keys 1, 2, 3, 4</span>
    </div>

    <!-- Hotbar Display -->
    <div class="hotbar">
        <div class="slot slot-1 active" id="slot-1">1</div>
        <div class="slot slot-2" id="slot-2">2</div>
        <div class="slot slot-3" id="slot-3">3</div>
        <div class="slot slot-4" id="slot-4">4</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Setup clean responsive windows scaling
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const blockSize = 32;
        let cameraX = 0;
        let activeSlot = 1;
        const world = {};

        // Local Block Texture Color Mapping Matrix
        const blockColors = {
            1: '#557a2b', // Grass
            2: '#866043', // Dirt
            3: '#7a7a7a', // Stone
            4: '#b0722a'  // Wood
        };

        // Procedural World Terrain Generator Logic (Generates completely inside browser memory)
        function generateChunk(chunkX) {
            for (let x = 0; x < 20; x++) {
                const globalX = chunkX * 20 + x;
                if (world[globalX]) continue;

                world[globalX] = {};
                // Terrain sine wave generation mathematical layout height rules
                const groundY = Math.floor(Math.sin(globalX * 0.1) * 3) + 12;

                for (let y = 0; y < 30; y++) {
                    if (y === groundY) world[globalX][y] = 1; // Surface Layer: Grass
                    else if (y > groundY && y < groundY + 4) world[globalX][y] = 2; // Middle Layer: Dirt
                    else if (y >= groundY + 4) world[globalX][y] = 3; // Deep Layer: Stone
                }
            }
        }

        // Camera Pan Controller Inputs
        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key === '1') selectSlot(1);
            if (e.key === '2') selectSlot(2);
            if (e.key === '3') selectSlot(3);
            if (e.key === '4') selectSlot(4);
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function selectSlot(slot) {
            document.getElementById(`slot-${activeSlot}`).classList.remove('active');
            activeSlot = slot;
            document.getElementById(`slot-${activeSlot}`).classList.add('active');
        }

        // Mouse Interactivity Physics (Mining & Building grids)
        window.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left + cameraX;
            const clickY = e.clientY - rect.top;

            const blockX = Math.floor(clickX / blockSize);
            const blockY = Math.floor(clickY / blockSize);

            if (!world[blockX]) world[blockX] = {};

            if (e.shiftKey) {
                // Shift + Click: Place Block
                if (!world[blockX][blockY]) {
                    world[blockX][blockY] = activeSlot;
                }
            } else {
                // Click: Mine/Break Block
                if (world[blockX][blockY]) {
                    delete world[blockX][blockY];
                }
            }
        });

        // Principal Core Game Engine Execution Loops
        function update() {
            if (keys['KeyA'] || keys['ArrowLeft']) cameraX -= 5;
            if (keys['KeyD'] || keys['ArrowRight']) cameraX += 5;
            if (cameraX < -5000) cameraX = -5000;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Sky Backdrop Gradients Elements
            ctx.fillStyle = '#40a0ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const startChunk = Math.floor(cameraX / (20 * blockSize)) - 1;
            const endChunk = startChunk + Math.ceil(canvas.width / (20 * blockSize)) + 2;

            for (let c = startChunk; c <= endChunk; c++) {
                generateChunk(c);
            }

            const startX = Math.floor(cameraX / blockSize) - 1;
            const endX = startX + Math.ceil(canvas.width / blockSize) + 2;

            for (let x = startX; x <= endX; x++) {
                if (!world[x]) continue;
                for (let y = 0; y < 40; y++) {
                    const blockType = world[x][y];
                    if (blockType && blockColors[blockType]) {
                        ctx.fillStyle = blockColors[blockType];
                        ctx.fillRect(x * blockSize - cameraX, y * blockSize, blockSize, blockSize);
                        
                        // Clean outline borders defining the grid lines structure look
                        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                        ctx.strokeRect(x * blockSize - cameraX, y * blockSize, blockSize, blockSize);
                    }
                }
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
