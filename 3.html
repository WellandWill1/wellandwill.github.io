<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Session - 3</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #80c0ff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; background: #80c0ff; cursor: crosshair; }
        .controls-overlay { position: absolute; top: 15px; left: 15px; background: rgba(20, 20, 20, 0.9); border: 2px solid #ffc93c; padding: 15px; border-radius: 6px; color: #fff; font-size: 0.85rem; pointer-events: none; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; }
        .hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 6px; border-radius: 4px; border: 2px solid #333; z-index: 100; }
        .slot { width: 45px; height: 45px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid transparent; color: #fff; font-size: 1rem; text-shadow: 1px 1px 2px #000; }
        .slot.active { border-color: #ffffff; background: rgba(255,255,255,0.2); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .slot-1 { background-color: #557a2b; border-bottom: 4px solid #3b571e; } /* Grass */
        .slot-2 { background-color: #d0b070; border-bottom: 4px solid #9e7b43; } /* Wood Plank */
        .slot-3 { background-color: #7a7a7a; border-bottom: 4px solid #555555; } /* Stone */
        .slot-4 { background-color: #e5c158; border-bottom: 4px solid #bfa03f; } /* Sand */
        .crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); mix-blend-mode: difference; }
        .crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        .crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
    </style>
</head>
<body>

    <div class="controls-overlay">
        <strong style="color: #ffc93c; text-transform: uppercase;">Unblocked Craft 3D Build</strong><br>
        • Move Around: <span style="color: #ff9a3c;">W, A, S, D</span><br>
        • Jump: <span style="color: #ff9a3c;">Spacebar</span><br>
        • Look: <span style="color: #ff9a3c;">Click screen & Move Mouse</span><br>
        • Break Block: <span style="color: #ff9a3c;">Left Click</span><br>
        • Place Block: <span style="color: #ff9a3c;">Right Click</span><br>
        • Switch Block: <span style="color: #ff9a3c;">Keys 1, 2, 3, 4</span>
    </div>

    <div class="crosshair"></div>
    <div class="hotbar">
        <div class="slot slot-1 active" id="slot-1">1</div>
        <div class="slot slot-2" id="slot-2">2</div>
        <div class="slot slot-3" id="slot-3">3</div>
        <div class="slot slot-4" id="slot-4">4</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let player = { x: 4.5, y: 5.5, z: 4.5, pitch: 0, yaw: 0, velocityY: 0, onGround: false };
        let activeBlock = 1;
        const world = {};

        const blockColors = {
            1: { top: '#6ba33b', side: '#4d7528' }, // Grass
            2: { top: '#dfbc7a', side: '#b5975e' }, // Wood Planks
            3: { top: '#8a8a8a', side: '#6e6e6e' }, // Stone
            4: { top: '#e5c158', side: '#cbb049' }  // Sand
        };

        for (let x = 0; x < 10; x++) {
            for (let z = 0; z < 10; z++) {
                world[`${x},2,${z}`] = 3;
                world[`${x},3,${z}`] = 1;
            }
        }

        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === canvas) {
                player.yaw -= e.movementX * 0.003;
                player.pitch -= e.movementY * 0.003;
                player.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.pitch));
            }
        });

        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key >= '1' && e.key <= '4') {
                document.getElementById(`slot-${activeBlock}`).classList.remove('active');
                activeBlock = parseInt(e.key);
                document.getElementById(`slot-${activeBlock}`).classList.add('active');
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        // 🖱️ Block Mining & Building Grids Interaction Raycasting Array
        window.addEventListener('mousedown', e => {
            if (document.pointerLockElement !== canvas) return;
            let rx = player.x, ry = player.y, rz = player.z;
            let dx = Math.cos(player.pitch) * Math.sin(player.yaw);
            let dy = Math.sin(player.pitch);
            let dz = Math.cos(player.pitch) * Math.cos(player.yaw);
            let hit = null, lastValidAirBlock = null;

            for (let i = 0; i < 80; i++) {
                rx += dx * 0.06; ry += dy * 0.06; rz += dz * 0.06;
                let bx = Math.floor(rx), by = Math.floor(ry), bz = Math.floor(rz);
                if (world[`${bx},${by},${bz}`]) { hit = {x: bx, y: by, z: bz}; break; }
                lastValidAirBlock = {x: bx, y: by, z: bz};
            }
            if (e.button === 0 && hit) { // Left Click: Instant Break
                delete world[`${hit.x},${hit.y},${hit.z}`];
            }
            if (e.button === 2 && lastValidAirBlock) { // Right Click: Instant Build
                let pX = Math.floor(player.x), pZ = Math.floor(player.z);
                // Prevent placing a voxel inside your own character position boxes
                if (lastValidAirBlock.x !== pX || lastValidAirBlock.z !== pZ || lastValidAirBlock.y !== Math.floor(player.y)) {
                    world[`${lastValidAirBlock.x},${lastValidAirBlock.y},${lastValidAirBlock.z}`] = activeBlock;
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 🛠️ Structural Perspective 3D Projection Engine Calculations Matrix
        function project(x, y, z) {
            let relX = x - player.x, relY = y - player.y, relZ = z - player.z;
            let cosY = Math.cos(-player.yaw), sinY = Math.sin(-player.yaw);
            let cosP = Math.cos(-player.pitch), sinP = Math.sin(-player.pitch);
            
            let rotX = relX * cosY - relZ * sinY;
            let rotZ = relX * sinY + relZ * cosY;
            let rotY = relY * cosP - rotZ * sinP;
            let finalDepthZ = relY * sinP + rotZ * cosP;
            
            if (finalDepthZ <= 0.12) return null;
            let fovScale = Math.min(canvas.width, canvas.height) * 0.85;
            return { x: canvas.width / 2 + (rotX / finalDepthZ) * fovScale, y: canvas.height / 2 - (rotY / finalDepthZ) * fovScale };
        }

        function renderFace(p1, p2, p3, p4, colorHex) {
            let points = [project(...p1), project(...p2), project(...p3), project(...p4)];
            if (points.some(p => !p)) return;
            ctx.fillStyle = colorHex; ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y); points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.14)'; ctx.lineWidth = 0.5; ctx.stroke();
        }

        // 🔄 Main Game Engine Tick Physics Loop Execution Updates
        function loop() {
            let moveVectorX = 0, moveVectorZ = 0;
            // ✅ WASD CAM DIRECTION MECHANICS: W always moves you forward matching look angles exactly!
            if (keys['KeyW']) { moveVectorX += Math.sin(player.yaw); moveVectorZ += Math.cos(player.yaw); }
            if (keys['KeyS']) { moveVectorX -= Math.sin(player.yaw); moveVectorZ -= Math.cos(player.yaw); }
            if (keys['KeyA']) { moveVectorX -= Math.cos(player.yaw); moveVectorZ += Math.sin(player.yaw); }
            if (keys['KeyD']) { moveVectorX += Math.cos(player.yaw); moveVectorZ -= Math.sin(player.yaw); }
            
            if (moveVectorX !== 0 || moveVectorZ !== 0) {
                let mag = Math.sqrt(moveVectorX*moveVectorX + moveVectorZ*moveVectorZ);
                player.x += (moveVectorX/mag) * 0.065; player.z += (moveVectorZ/mag) * 0.065;
            }

            // Gravity Calculation Math Loop
            player.velocityY -= 0.012; player.y += player.velocityY;
            let currentFloorY = Math.floor(player.y - 1.6);
            if (world[`${Math.floor(player.x)},${currentFloorY},${Math.floor(player.z)}`]) {
                player.y = currentFloorY + 1.6 + 1.0; player.velocityY = 0; player.onGround = true;
            } else { player.onGround = false; }
            if (keys['Space'] && player.onGround) { player.velocityY = 0.22; player.onGround = false; }

            // Restrict movement boundary clip frames
            player.x = Math.max(0.1, Math.min(9.9, player.x));
            player.z = Math.max(0.1, Math.min(9.9, player.z));

            // Clear Background Canvas & Redraw Blue Horizon Sky
            ctx.fillStyle = '#80c0ff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fetch and Depth-Sort Cubes Arrays (Z-sorting prevents visual errors)
            let queue = [];
            for (let coordinates in world) {
                let [x, y, z] = coordinates.split(',').map(Number);
                let d = (x-player.x)**2 + (y-player.y)**2 + (z-player.z)**2;
                queue.push({x: x, y: y, z: z, type: world[coordinates], dist: d});
            }
            queue.sort((a, b) => b.dist - a.dist);

            // Project visible voxel meshes mapping vectors
            queue.forEach(cube => {
                let [x, y, z] = [cube.x, cube.y, cube.z];
                let col = blockColors[cube.type];
                let topFacePoints = [[x, y+1, z], [x+1, y+1, z], [x+1, y+1, z+1], [x, y+1, z+1]];
                let sideFace1 = [[x, y, z], [x+1, y, z], [x+1, y+1, z], [x, y+1, z]];
                let sideFace2 = [[x+1, y, z], [x+1, y, z+1], [x+1, y+1, z+1], [x+1, y+1, z]];
                let sideFace3 = [[x+1, y, z+1], [x, y, z+1], [x, y+1, z+1], [x+1, y+1, z+1]];
                let sideFace4 = [[x, y, z+1], [x, y, z], [x, y+1, z], [x, y+1, z+1]];

                if (player.y > y + 1) renderFace(topFacePoints[0], topFacePoints[1], topFacePoints[2], topFacePoints[3], col.top);
                if (player.z < z) renderFace(sideFace1[0], sideFace1[1], sideFace1[2], sideFace1[3], col.side);
                if (player.x > x + 1) renderFace(sideFace2[0], sideFace2[1], sideFace2[2], sideFace2[3], col.side);
                if (player.z > z + 1) renderFace(sideFace3[0], sideFace3[1], sideFace3[2], sideFace3[3], col.side);
                if (player.x < x) renderFace(sideFace4[0], sideFace4[1], sideFace4[2], sideFace4[3], col.side);
            });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
