<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade - 3</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #80c0ff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; background: #80c0ff; cursor: crosshair; }
        .controls-overlay { position: absolute; top: 15px; left: 15px; background: rgba(20, 20, 20, 0.9); border: 2px solid #ffc93c; padding: 15px; border-radius: 6px; color: #fff; font-size: 0.85rem; pointer-events: none; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; }
        .hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.75); padding: 6px; border-radius: 4px; border: 2px solid #333; z-index: 100; }
        .slot { width: 45px; height: 45px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid transparent; color: #fff; font-size: 1.1rem; text-shadow: 1px 1px 2px #000; }
        .slot.active { border-color: #ffffff; background: rgba(255,255,255,0.2); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .slot-1 { background-color: #6ba33b; border-bottom: 4px solid #3b571e; }
        .slot-2 { background-color: #7a7a7a; border-bottom: 4px solid #555555; }
        .slot-3 { background-color: #a3835b; border-bottom: 4px solid #6b533b; }
        .slot-4 { background-color: #b55346; border-bottom: 4px solid #7c352e; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); mix-blend-mode: difference; }
        .crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        .crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
    </style>
</head>
<body>

    <div class="controls-overlay">
        <strong style="color: #ffc93c; text-transform: uppercase;">ClassiCube Standalone Build</strong><br>
        • Move Around: <span style="color: #ff9a3c;">W, A, S, D</span><br>
        • Jump Up: <span style="color: #ff9a3c;">Spacebar</span><br>
        • Look: <span style="color: #ff9a3c;">Click screen & Move Mouse</span><br>
        • Break Block: <span style="color: #ff9a3c;">Left Click</span><br>
        • Place Block: <span style="color: #ff9a3c;">Right Click</span><br>
        • Switch Block: <span style="color: #ff9a3c;">Keys 1, 2, 3, 4</span>
    </div>

    <div class="crosshair"></div>
    <div class="hotbar">
        <div class="slot slot-1 active" id="slot-1">G</div>
        <div class="slot slot-2" id="slot-2">C</div>
        <div class="slot slot-3" id="slot-3">O</div>
        <div class="slot slot-4" id="slot-4">B</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let player = { x: 7.5, y: 6.5, z: 7.5, pitch: 0, yaw: 0, velocityY: 0, onGround: false };
        let activeBlock = 1;
        const world = {};

        // Texture Face Profiles Matrix 
        const faceColors = {
            1: { top: '#6ba33b', side: '#4d7528', bottom: '#866043' }, // Grass
            2: { top: '#8a8a8a', side: '#6e6e6e', bottom: '#555555' }, // Cobble
            3: { top: '#a3835b', side: '#6b533b', bottom: '#a3835b' }, // Oak Log
            4: { top: '#b55346', side: '#a1453a', bottom: '#b55346' }  // Brick
        };

        // Build Plateau World Ground 
        for (let x = 0; x < 15; x++) {
            for (let z = 0; z < 15; z++) {
                let height = 3; 
                for (let y = 0; y <= height; y++) {
                    let type = 2; // Cobble floor depth
                    if (y === height) type = 1; // Grass field top skin
                    world[`${x},${y},${z}`] = type;
                }
            }
        }

        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === canvas) {
                player.yaw -= e.movementX * 0.0025;
                player.pitch += e.movementY * 0.0025; // Clean mouse movement orientation
                player.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.pitch));
            }
        });

        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key >= '1' && e.key <= '4') {
                document.getElementById(`slot-${activeBlock}`).classList.remove('active');
                activeBlock = parseInt(e.key);
                document.getElementById(`slot-${activeBlock}`).classList.add('active');
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);

        let cameraX, cameraY, cameraZ;
        function project(x, y, z) {
            let relX = x - cameraX, relY = y - cameraY, relZ = z - cameraZ;
            let cosY = Math.cos(-player.yaw), sinY = Math.sin(-player.yaw);
            let cosP = Math.cos(-player.pitch), sinP = Math.sin(-player.pitch);

            let rotX = relX * cosY - relZ * sinY;
            let rotZ = relX * sinY + relZ * cosY;
            let rotY = relY * cosP - rotZ * sinP;
            let finalZ = relY * sinP + rotZ * cosP;

            if (finalZ <= 0.15) return null;

            let fov = Math.min(canvas.width, canvas.height) * 0.9;
            return {
                x: canvas.width / 2 + (rotX / finalZ) * fov,
                y: canvas.height / 2 - (rotY / finalZ) * fov,
                z: finalZ
            };
        }
        // 🖱️ FIRST-PERSON INTERACTION RAYCASTING ENGINE (Mining & Placing Blocks)
        window.addEventListener('mousedown', e => {
            if (document.pointerLockElement !== canvas) return;

            let rayX = cameraX, rayY = cameraY, rayZ = cameraZ;
            let dirX = Math.cos(player.pitch) * Math.sin(player.yaw);
            let dirY = Math.sin(player.pitch);
            let dirZ = Math.cos(player.pitch) * Math.cos(player.yaw);

            let lastValidBlock = null;
            let targetHitBlock = null;

            for (let step = 0; step < 120; step++) {
                rayX += dirX * 0.05; rayY += dirY * 0.05; rayZ += dirZ * 0.05;
                let bx = Math.floor(rayX), by = Math.floor(rayY), bz = Math.floor(rayZ);
                let blockFound = world[`${bx},${by},${bz}`];

                if (blockFound) {
                    targetHitBlock = {x: bx, y: by, z: bz};
                    break;
                }
                lastValidBlock = {x: bx, y: by, z: bz};
            }

            if (e.button === 0 && targetHitBlock) { 
                // Left Click: Break
                delete world[`${targetHitBlock.x},${targetHitBlock.y},${targetHitBlock.z}`];
            } 
            else if (e.button === 2 && lastValidBlock) { 
                // Right Click: Build
                let pX = Math.floor(player.x), pY = Math.floor(player.y), pZ = Math.floor(player.z);
                let hitsPlayer = (lastValidBlock.x === pX && lastValidBlock.z === pZ && (lastValidBlock.y === pY || lastValidBlock.y === Math.floor(player.y + 0.5)));
                if (!hitsPlayer) {
                    world[`${lastValidBlock.x},${lastValidBlock.y},${lastValidBlock.z}`] = activeBlock;
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 🎨 TEXTURE GENERATOR ENGINE (Simulates classic 16x16 pixel texturing dynamically)
        function drawTexturedFace(pts, type, faceType) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            ctx.lineTo(pts[1].x, pts[1].y);
            ctx.lineTo(pts[2].x, pts[2].y);
            ctx.lineTo(pts[3].x, pts[3].y);
            ctx.closePath();

            let baseColors = {
                1: { top: '#6ba33b', side: '#4d7528', bottom: '#866043' }, // Grass Block
                2: { top: '#8a8a8a', side: '#6e6e6e', bottom: '#555555' }, // Cobblestone
                3: { top: '#a3835b', side: '#6b533b', bottom: '#a3835b' }, // Oak Log
                4: { top: '#b55346', side: '#a1453a', bottom: '#b55346' }  // Bricks
            };
            
            let color = baseColors[type][faceType];
            ctx.fillStyle = color;
            ctx.fill();

            // Create pixel patterns overlay grid natively to look like ClassiCube textures
            ctx.fillStyle = faceType === 'top' ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
            for (let i = 0; i < 4; i++) {
                if ((i + type) % 2 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo((pts[i].x + pts[(i+1)%4].x)/2, (pts[i].y + pts[(i+1)%4].y)/2);
                    ctx.lineTo((pts[2].x + pts[0].x)/2, (pts[2].y + pts[0].y)/2);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.18)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        // 🔄 MASTER RUNTIME TICK LOOP
        function loop() {
            // ✅ DIRECTIONAL CAM ACTION VECTOR CALCULATIONS (W follows look angles exactly)
            let speed = 0.075;
            let moveX = 0, moveZ = 0;
            
            let forwardX = Math.sin(player.yaw);
            let forwardZ = Math.cos(player.yaw);
            let strafeX = Math.cos(player.yaw);
            let strafeZ = -Math.sin(player.yaw);

            if (keys['KeyW']) { moveX += forwardX; moveZ += forwardZ; }
            if (keys['KeyS']) { moveX -= forwardX; moveZ -= forwardZ; }
            if (keys['KeyA']) { moveX -= strafeX; moveZ -= strafeZ; }
            if (keys['KeyD']) { moveX += strafeX; moveZ += strafeZ; }

            if (moveX !== 0 || moveZ !== 0) {
                let mag = Math.sqrt(moveX * moveX + moveZ * moveZ);
                player.x += (moveX / mag) * speed;
                player.z += (moveZ / mag) * speed;
            }

            // Gravity Calculation Math
            player.velocityY -= 0.014;
            player.y += player.velocityY;

            let pX = Math.floor(player.x), pZ = Math.floor(player.z);
            let standingY = Math.floor(player.y - 1.6);
            let checkBlockBase = world[`${pX},${standingY},${pZ}`];

            if (checkBlockBase) {
                player.y = standingY + 1.0 + 1.6;
                player.velocityY = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }

            if (keys['Space'] && player.onGround) {
                player.velocityY = 0.23;
                player.onGround = false;
            }

            player.x = Math.max(0.2, Math.min(13.8, player.x));
            player.z = Math.max(0.2, Math.min(13.8, player.z));

            cameraX = player.x; cameraY = player.y; cameraZ = player.z;

            // Render Sky Blue Field
            ctx.fillStyle = '#80c0ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fetch and Sort Queues
            let renderQueue = [];
            for (let coord in world) {
                let [x, y, z] = coord.split(',').map(Number);
                let distance = Math.sqrt((x - cameraX) ** 2 + (y - cameraY) ** 2 + (z - cameraZ) ** 2);
                if (distance < 14) {
                    renderQueue.push({x: x, y: y, z: z, type: world[coord], dist: distance});
                }
            }
            renderQueue.sort((a, b) => b.dist - a.dist);

            // Render Polygon Points Blocks
            renderQueue.forEach(cube => {
                let [x, y, z] = [cube.x, cube.y, cube.z];
                let v = [
                    [x, y+1, z], [x+1, y+1, z], [x+1, y+1, z+1], [x, y+1, z+1], // Top vertices
                    [x, y, z], [x+1, y, z], [x+1, y, z+1], [x, y, z+1]          // Bottom vertices
                ];

                let p = v.map(vertex => project(...vertex));

                let drawFaceIfValid = (i1, i2, i3, i4, faceType) => {
                    let pts = [p[i1], p[i2], p[i3], p[i4]];
                    if (pts.some(pt => !pt)) return;
                    drawTexturedFace(pts, cube.type, faceType);
                };

                // Project visible block surfaces dynamically based on viewpoint positions
                if (cameraY > y + 1) drawFaceIfValid(0, 1, 2, 3, 'top');
                if (cameraZ > z + 1) drawFaceIfValid(4, 5, 1, 0, 'side');
                if (cameraX > x + 1) drawFaceIfValid(5, 6, 2, 1, 'side');
                if (cameraZ < z)     drawFaceIfValid(6, 7, 3, 2, 'side');
                if (cameraX < x)     drawFaceIfValid(7, 4, 0, 3, 'side');
                if (cameraY < y)     drawFaceIfValid(7, 6, 5, 4, 'bottom');
            });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
