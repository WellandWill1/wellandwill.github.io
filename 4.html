<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - 4</title>
    <style>
        html, body { height: 100%; margin: 0; background: #0b0c10; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .game-wrapper { display: flex; flex-direction: column; align-items: center; max-width: 500px; width: 100%; padding: 20px; }
        .header-title { font-size: 2.2rem; font-weight: bold; color: #ffc93c; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,201,60,0.2); }
        .grid-board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .grid-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 52px; height: 52px; border: 2px solid #1f2833; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; text-transform: uppercase; background: rgba(31, 40, 51, 0.3); transition: all 0.15s ease; }
        .tile.filled { border-color: #ff9a3c; }
        .tile.correct { background-color: #557a2b; border-color: #557a2b; }
        .tile.present { background-color: #ff9a3c; border-color: #ff9a3c; }
        .tile.absent { background-color: #343a40; border-color: #343a40; color: #868e96; }
        .keyboard-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; width: 100%; }
        .key-btn { background: #1f2833; color: #fff; border: 1px solid rgba(255,154,60,0.1); padding: 14px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; user-select: none; flex: 1; text-transform: uppercase; font-size: 0.9rem; transition: background 0.1s; }
        .key-btn:hover { background: #ff9a3c; color: #0b0c10; }
        .key-btn.wide { flex: 1.5; font-size: 0.8rem; }
        .message-box { min-height: 25px; color: #ffc93c; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header-title">Wordle Console</div>
        <div class="message-box" id="msg-label"></div>
        <div class="grid-board" id="board"></div>
        
        <div style="width: 100%; margin-top: 10px;">
            <div class="keyboard-row" id="kb-row-1"></div>
            <div class="keyboard-row" id="kb-row-2"></div>
            <div class="keyboard-row" id="kb-row-3"></div>
        </div>
    </div>

    <script>
        // Localized system core dictionary list to remain 100% network block proof
        const wordPool = ["GAMES", "BUILD", "CRAFT", "PLANK", "BRICK", "STONE", "YOUTUB", "GAMES", "PIXEL", "STEAL", "SMART", "CORES", "LOGIC", "CHECK", "SKILL", "WINNER", "MATCH", "WORLD", "TIMER", "LEVEL", "SPEED", "TRAIN"];
        const targetWord = wordPool[Math.floor(Math.random() * wordPool.length)];
        
        let currentRow = 0, currentTile = 0;
        let guesses = Array(6).fill("").map(() => Array(5).fill(""));
        let gameOver = false;

        function initBoard() {
            const board = document.getElementById('board');
            for (let r = 0; r < 6; r++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                for (let c = 0; c < 5; c++) {
                    let tileDiv = document.createElement('div');
                    tileDiv.className = 'tile';
                    tileDiv.id = `tile-${r}-${c}`;
                    rowDiv.appendChild(tileDiv);
                }
                board.appendChild(rowDiv);
            }
            initKeyboard();
        }

        function initKeyboard() {
            const row1 = "QWERTYUIOP", row2 = "ASDFGHJKL", row3 = "ZXCVBNM";
            setupKeys(row1, 'kb-row-1');
            setupKeys(row2, 'kb-row-2');
            
            const r3Wrapper = document.getElementById('kb-row-3');
            r3Wrapper.innerHTML = `<button class="key-btn wide" onclick="handleInput('ENTER')">ENTER</button>`;
            setupKeys(row3, 'kb-row-3', true);
            r3Wrapper.innerHTML += `<button class="key-btn wide" onclick="handleInput('BACKSPACE')">DEL</button>`;
        }

        function setupKeys(letters, targetRowId, append = false) {
            const wrapper = document.getElementById(targetRowId);
            let html = "";
            for (let char of letters) {
                html += `<button class="key-btn" onclick="handleInput('${char}')">${char}</button>`;
            }
            if (append) wrapper.innerHTML += html;
            else wrapper.innerHTML = html;
        }

        function handleInput(key) {
            if (gameOver) return;
            if (key === 'BACKSPACE' || key === 'Delete') {
                if (currentTile > 0) {
                    currentTile--;
                    guesses[currentRow][currentTile] = "";
                    updateTileUI(currentRow, currentTile, "");
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) checkGuess();
                else showMessage("Not enough letters!");
            } else if (/^[A-Z]\$/.test(key)) {
                if (currentTile < 5) {
                    guesses[currentRow][currentTile] = key;
                    updateTileUI(currentRow, currentTile, key);
                    currentTile++;
                }
            }
        }

        function updateTileUI(r, c, letter) {
            let tile = document.getElementById(`tile-${r}-${c}`);
            tile.innerText = letter;
            if (letter) tile.classList.add('filled');
            else tile.classList.remove('filled');
        }

        function checkGuess() {
            let guess = guesses[currentRow].join("");
            let targetLetterCounts = {};
            
            for (let char of targetWord) {
                targetLetterCounts[char] = (targetLetterCounts[char] || 0) + 1;
            }

            // Green verification pass
            for (let i = 0; i < 5; i++) {
                let tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (guess[i] === targetWord[i]) {
                    tile.classList.add('correct');
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Yellow/Grey validation pass
            for (let i = 0; i < 5; i++) {
                let tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (tile.classList.contains('correct')) continue;
                
                if (targetWord.includes(guess[i]) && targetLetterCounts[guess[i]] > 0) {
                    tile.classList.add('present');
                    targetLetterCounts[guess[i]]--;
                } else {
                    tile.classList.add('absent');
                }
            }

            if (guess === targetWord) {
                showMessage("🎉 Splendid win! Genius streak.");
                gameOver = true;
                return;
            }

            if (currentRow === 5) {
                showMessage(`Game over! Word was: ${targetWord}`);
                gameOver = true;
                return;
            }

            currentRow++;
            currentTile = 0;
        }

        function showMessage(str) {
            const box = document.getElementById('msg-label');
            box.innerText = str;
            setTimeout(() => { if(box.innerText === str && !gameOver) box.innerText = ""; }, 2500);
        }

        window.addEventListener('keydown', e => handleInput(e.key.toUpperCase()));
        window.addEventListener('DOMContentLoaded', initBoard);
    </script>
</body>
</html>
