<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - Vault Session Edition</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-border: #3a3a3c;
            --key-bg: #818384;
            --correct-color: #538d4e;
            --present-color: #b59f3b;
            --absent-color: #3a3a3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-top: 15px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            color: #f57c00;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: bold;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-height: 60%;
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            max-width: 330px;
            width: 100%;
            height: 100%;
            max-height: 400px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            border: 2px solid var(--tile-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            aspect-ratio: 1 / 1;
            user-select: none;
        }

        .tile[data-state="pop"] {
            transform: scale(1.1);
            border-color: #565758;
        }

        .tile[data-state="correct"] { background-color: var(--correct-color); border-color: var(--correct-color); }
        .tile[data-state="present"] { background-color: var(--present-color); border-color: var(--present-color); }
        .tile[data-state="absent"] { background-color: var(--absent-color); border-color: var(--absent-color); }

        #keyboard {
            margin: 0 auto 20px;
            width: 100%;
            max-width: 480px;
            padding: 0 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .keyboard-row {
            display: flex;
            width: 100%;
            margin-bottom: 6px;
            justify-content: center;
        }

        .key {
            font-family: inherit;
            font-weight: bold;
            border: 0;
            padding: 0;
            margin: 0 2px;
            height: 54px;
            background-color: var(--key-bg);
            color: var(--text-color);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-size: 1.1rem;
        }

        .key.wide {
            flex: 1.5;
            font-size: 0.85rem;
        }

        .key[data-state="correct"] { background-color: var(--correct-color); }
        .key[data-state="present"] { background-color: var(--present-color); }
        .key[data-state="absent"] { background-color: var(--absent-color); }

        #message {
            position: absolute;
            top: 12%;
            background-color: #ffffff;
            color: #000000;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>Wordle</h1>
        <div class="subtitle">Vault Session Edition</div>
    </header>

    <div id="game-container">
        <div id="message"></div>
        <div id="grid"></div>
    </div>

    <div id="keyboard"></div>

    <script>
        // --- GAME CONFIGURATION ---
        const ANSWER = "VAULT"; 
        const MAX_ATTEMPTS = 6;
        const WORD_LENGTH = 5;

        let currentRow = 0;
        let currentTile = 0;
        let guesses = Array(MAX_ATTEMPTS).fill().map(() => Array(WORD_LENGTH).fill(""));
        let gameOver = false;

        const gridElement = document.getElementById('grid');
        const keyboardElement = document.getElementById('keyboard');
        const messageElement = document.getElementById('message');
        // --- INITIALIZE GAME INTERFACE ---
        function initGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < MAX_ATTEMPTS; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                rowDiv.id = 'row-' + r;
                for (let t = 0; t < WORD_LENGTH; t++) {
                    const tileDiv = document.createElement('div');
                    tileDiv.className = 'tile';
                    tileDiv.id = 'row-' + r + '-tile-' + t;
                    rowDiv.appendChild(tileDiv);
                }
                gridElement.appendChild(rowDiv);
            }
        }

        function initKeyboard() {
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
            ];

            keyboardElement.innerHTML = '';
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                row.forEach(key => {
                    const button = document.createElement('button');
                    button.textContent = key;
                    button.className = 'key';
                    button.setAttribute('data-key', key);
                    if (key === 'ENTER' || key === 'DEL') {
                        button.classList.add('wide');
                    }
                    button.addEventListener('click', () => handleInput(key));
                    rowDiv.appendChild(button);
                });
                keyboardElement.appendChild(rowDiv);
            });
        }

        // --- CORE LOGIC CONTROLLER ---
        function handleInput(key) {
            if (gameOver) return;

            if (key === 'ENTER') {
                submitGuess();
            } else if (key === 'DEL' || key === 'BACKSPACE') {
                deleteLetter();
            } else if (/^[A-Z]$/.test(key)) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentTile < WORD_LENGTH) {
                guesses[currentRow][currentTile] = letter;
                const tile = document.getElementById('row-' + currentRow + '-tile-' + currentTile);
                tile.textContent = letter;
                tile.setAttribute('data-state', 'pop');
                setTimeout(() => tile.removeAttribute('data-state'), 100);
                currentTile++;
            }
        }

        function deleteLetter() {
            if (currentTile > 0) {
                currentTile--;
                guesses[currentRow][currentTile] = "";
                const tile = document.getElementById('row-' + currentRow + '-tile-' + currentTile);
                tile.textContent = "";
                tile.removeAttribute('data-state');
            }
        }

        function submitGuess() {
            if (currentTile < WORD_LENGTH) {
                showMessage("Not enough letters");
                return;
            }

            const currentGuess = guesses[currentRow].join("");
            revealRow(currentRow, currentGuess);

            if (currentGuess === ANSWER) {
                showMessage("Genius! You Won!");
                gameOver = true;
                return;
            }

            if (currentRow >= MAX_ATTEMPTS - 1) {
                showMessage('Game Over! Word was: ' + ANSWER);
                gameOver = true;
                return;
            }

            currentRow++;
            currentTile = 0;
        }

        function revealRow(rowIdx, guess) {
            let answerLetterCounts = {};
            for (let i = 0; i < ANSWER.length; i++) {
                answerLetterCounts[ANSWER[i]] = (answerLetterCounts[ANSWER[i]] || 0) + 1;
            }

            let statuses = Array(WORD_LENGTH).fill("absent");

            // First pass: Mark exact green matches
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guess[i] === ANSWER[i]) {
                    statuses[i] = "correct";
                    answerLetterCounts[guess[i]]--;
                }
            }

            // Second pass: Mark yellow present matches
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (statuses[i] !== "correct" && ANSWER.includes(guess[i])) {
                    if (answerLetterCounts[guess[i]] > 0) {
                        statuses[i] = "present";
                        answerLetterCounts[guess[i]]--;
                    }
                }
            }

            // Update UI grid and layout keys
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById('row-' + rowIdx + '-tile-' + i);
                const letter = guess[i];
                tile.setAttribute('data-state', statuses[i]);
                updateKeyboardKey(letter, statuses[i]);
            }
        }

        function updateKeyboardKey(letter, status) {
            const keyBtn = document.querySelector('.key[data-key="' + letter + '"]');
            if (!keyBtn) return;

            const currentStatus = keyBtn.getAttribute('data-state');
            if (currentStatus === 'correct') return; 
            if (currentStatus === 'present' && status === 'absent') return; 

            keyBtn.setAttribute('data-state', status);
        }

        function showMessage(text) {
            messageElement.textContent = text;
            messageElement.style.opacity = 1;
            setTimeout(() => {
                messageElement.style.opacity = 0;
            }, 2500);
        }

        // --- BIND BROWSER PHYSICAL KEY INPUT ---
        window.addEventListener('keydown', (e) => {
            let key = e.key.toUpperCase();
            if (e.key === 'Backspace') key = 'DEL';
            handleInput(key);
        });

        // Start game
        initGrid();
        initKeyboard();
    </script>
</body>
</html>
