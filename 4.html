<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - 4</title>
    <style>
        :root {
            --bg-color: #0b0c10;          /* Deep Dark Background */
            --card-color: #1f2833;        /* Dark Slate Elements */
            --accent-primary: #ffc93c;    /* Warm Gold Primary */
            --accent-secondary: #ff9a3c;  /* Dimmed Gold Secondary */
            --text-color: #c5c6c7;        /* General Body text */
            --text-light: #ffffff;        /* Heading White */
        }
        html, body { 
            height: 100%; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .game-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            max-width: 500px; 
            width: 100%; 
            padding: 20px; 
        }
        .header-title { 
            font-size: 2.2rem; 
            font-weight: bold; 
            color: var(--text-light); 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            letter-spacing: 3px; 
            text-shadow: 0 0 15px rgba(255, 201, 60, 0.3); 
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--accent-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .grid-board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin-bottom: 25px; }
        .grid-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        
        /* 🎨 THEMED WORDLE TILE GRID MATRIX */
        .tile { 
            width: 54px; 
            height: 54px; 
            border: 2px solid var(--card-color); 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.8rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            background: rgba(31, 40, 51, 0.2); 
            color: var(--text-light);
            transition: all 0.15s ease; 
        }
        .tile.filled { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 10px rgba(255, 201, 60, 0.15);
        }
        
        /* Game Validation States */
        .tile.correct { background-color: #23a55a; border-color: #23a55a; } /* Green */
        .tile.present { background-color: var(--accent-secondary); border-color: var(--accent-secondary); } /* Gold/Yellow */
        .tile.absent { background-color: #12161a; border-color: #12161a; color: #4a525a; } /* Greyed Out */
        
        .keyboard-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 6px; width: 100%; }
        .key-btn { 
            background: var(--card-color); 
            color: var(--text-light); 
            border: 1px solid rgba(255, 154, 60, 0.15); 
            padding: 16px 8px; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none; 
            flex: 1; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            transition: all 0.15s; 
        }
        .key-btn:hover { 
            background: var(--accent-primary); 
            color: var(--bg-color); 
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(255, 201, 60, 0.3);
        }
        .key-btn.wide { flex: 1.6; font-size: 0.8rem; }
        .message-box { min-height: 25px; color: var(--accent-primary); font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header-title">Wordle</div>
        <div class="subtitle">Vault Session Edition</div>
        <div class="message-box" id="msg-label"></div>
        <div class="grid-board" id="board"></div>
        
        <div style="width: 100%; margin-top: 5px;">
            <div class="keyboard-row" id="kb-row-1"></div>
            <div class="keyboard-row" id="kb-row-2"></div>
            <div class="keyboard-row" id="kb-row-3"></div>
        </div>
    </div>

    <script>
        const wordPool = ["GAMES", "BUILD", "CRAFT", "PLANK", "BRICK", "STONE", "PIXEL", "STEAL", "SMART", "CORES", "LOGIC", "CHECK", "SKILL", "WINNER", "MATCH", "WORLD", "TIMER", "LEVEL", "SPEED", "TRAIN", "SCORES", "VAULT"];
        const targetWord = wordPool[Math.floor(Math.random() * wordPool.length)];
        
        let currentRow = 0, currentTile = 0;
        let guesses = Array(6).fill("").map(() => Array(5).fill(""));
        let gameOver = false;

        function initBoard() {
            const board = document.getElementById('board');
            for (let r = 0; r < 6; r++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                for (let c = 0; c < 5; c++) {
                    let tileDiv = document.createElement('div');
                    tileDiv.className = 'tile';
                    tileDiv.id = `tile-${r}-${c}`;
                    rowDiv.appendChild(tileDiv);
                }
                board.appendChild(rowDiv);
            }
            initKeyboard();
        }

        function initKeyboard() {
            const row1 = "QWERTYUIOP", row2 = "ASDFGHJKL", row3 = "ZXCVBNM";
            setupKeys(row1, 'kb-row-1');
            setupKeys(row2, 'kb-row-2');
            
            const r3Wrapper = document.getElementById('kb-row-3');
            r3Wrapper.innerHTML = `<button class="key-btn wide" onclick="handleInput('ENTER')">ENTER</button>`;
            setupKeys(row3, 'kb-row-3', true);
            r3Wrapper.innerHTML += `<button class="key-btn wide" onclick="handleInput('BACKSPACE')">DEL</button>`;
        }

        function setupKeys(letters, targetRowId, append = false) {
            const wrapper = document.getElementById(targetRowId);
            let html = "";
            for (let char of letters) {
                html += `<button class="key-btn" onclick="handleInput('${char}')">${char}</button>`;
            }
            if (append) wrapper.innerHTML += html;
            else wrapper.innerHTML = html;
        }

        function handleInput(key) {
            if (gameOver) return;
            if (key === 'BACKSPACE' || key === 'Delete') {
                if (currentTile > 0) {
                    currentTile--;
                    guesses[currentRow][currentTile] = "";
                    updateTileUI(currentRow, currentTile, "");
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) checkGuess();
                else showMessage("Not enough letters!");
            } else if (/^[A-Z]\$/.test(key)) {
                if (currentTile < 5) {
                    guesses[currentRow][currentTile] = key;
                    updateTileUI(currentRow, currentTile, key);
                    currentTile++;
                }
            }
        }

        function updateTileUI(r, c, letter) {
            let tile = document.getElementById(`tile-${r}-${c}`);
            tile.innerText = letter;
            if (letter) tile.classList.add('filled');
            else tile.classList.remove('filled');
        }

        function checkGuess() {
            let guess = guesses[currentRow].join("");
            let targetLetterCounts = {};
            
            for (let char of targetWord) {
                targetLetterCounts[char] = (targetLetterCounts[char] || 0) + 1;
            }

            for (let i = 0; i < 5; i++) {
                let tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (guess[i] === targetWord[i]) {
                    tile.classList.add('correct');
                    targetLetterCounts[guess[i]]--;
                }
            }

            for (let i = 0; i < 5; i++) {
                let tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (tile.classList.contains('correct')) continue;
                
                if (targetWord.includes(guess[i]) && targetLetterCounts[guess[i]] > 0) {
                    tile.classList.add('present');
                    targetLetterCounts[guess[i]]--;
                } else {
                    tile.classList.add('absent');
                }
            }

            if (guess === targetWord) {
                showMessage("🎉 WINNER! STREAK LOCKED IN.");
                gameOver = true;
                return;
            }

            if (currentRow === 5) {
                showMessage(`Game Over! Word: ${targetWord}`);
                gameOver = true;
                return;
            }

            currentRow++;
            currentTile = 0;
        }

        function showMessage(str) {
            const box = document.getElementById('msg-label');
            box.innerText = str;
            setTimeout(() => { if(box.innerText === str && !gameOver) box.innerText = ""; }, 2500);
        }

        window.addEventListener('keydown', e => handleInput(e.key.toUpperCase()));
        window.addEventListener('DOMContentLoaded', initBoard);
    </script>
</body>
</html>
