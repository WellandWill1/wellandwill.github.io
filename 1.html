<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - 1</title>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0;
            background: #0b0c10; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
        }
        .game-container { 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas { 
            background: #1f2833; 
            border: 4px solid #ffc93c; 
            border-radius: 8px; 
            box-shadow: 0 0 20px rgba(255, 201, 60, 0.2); 
        }
        .score { 
            font-size: 2rem; 
            font-weight: bold; 
            color: #ff9a3c; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score" id="score-board">Score: 0</div>
        <canvas id="game" width="400" height="400"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const context = canvas.getContext('2d');
        const grid = 16; let count = 0; let score = 0;
        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let apple = { x: 320, y: 320 };
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
        function loop() {
            requestAnimationFrame(loop);
            if (++count < 6) { return; } count = 0;
            context.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx; snake.y += snake.dy;
            if (snake.x < 0) snake.x = canvas.width - grid; else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid; else if (snake.y >= canvas.height) snake.y = 0;
            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) { snake.cells.pop(); }
            context.fillStyle = '#ff9a3c'; context.fillRect(apple.x, apple.y, grid-1, grid-1);
            context.fillStyle = '#ffc93c';
            snake.cells.forEach(function(cell, index) {
                context.fillRect(cell.x, cell.y, grid-1, grid-1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++; score += 10;
                    document.getElementById('score-board').innerText = "Score: " + score;
                    apple.x = getRandomInt(0, 25) * grid; apple.y = getRandomInt(0, 25) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (snake.cells[i] && cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        snake.x = 160; snake.y = 160; snake.cells = []; snake.maxCells = 4;
                        snake.dx = grid; snake.dy = 0; score = 0;
                        document.getElementById('score-board').innerText = "Score: " + score;
                        apple.x = getRandomInt(0, 25) * grid; apple.y = getRandomInt(0, 25) * grid;
                    }
                }
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });
        requestAnimationFrame(loop);
    </script>
</body>
</html>
